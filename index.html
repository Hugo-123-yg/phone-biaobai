<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#111214" />
  <meta name="description" content="用于小说和漫画剧情展示的本地虚构手机模拟器" />
  <title>iPhone</title>
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="虚构手机模拟器">
      <div class="island" aria-hidden="true"><span></span></div>
      <header class="status-bar">
        <span id="clock">09:41</span>
        <span class="status-icons" aria-label="蜂窝信号满格，Wi-Fi 已连接，电量 80%">
          <svg class="status-signal" viewBox="0 0 20 14" aria-hidden="true"><rect x="0" y="9" width="3" height="5" rx=".8"/><rect x="5" y="6" width="3" height="8" rx=".8"/><rect x="10" y="3" width="3" height="11" rx=".8"/><rect x="15" width="3" height="14" rx=".8"/></svg>
          <svg class="status-wifi" viewBox="0 0 20 15" aria-hidden="true"><path d="M2 4.5a12.5 12.5 0 0 1 16 0M5 8a8 8 0 0 1 10 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M7.7 11.3a3.8 3.8 0 0 1 4.6 0L10 14Z"/></svg>
          <svg class="status-battery" viewBox="0 0 30 15" aria-hidden="true"><rect x="1" y="1.5" width="25" height="12" rx="3" fill="none" stroke="currentColor" stroke-opacity=".5"/><rect x="3" y="3.5" width="18" height="8" rx="1.3"/><path d="M28 5v5c2-.5 2-4.5 0-5Z" opacity=".6"/></svg>
        </span>
      </header>

      <div id="screen" class="screen">
        <section id="lock-screen" class="lock-screen" aria-label="iPhone 锁定屏幕">
          <div class="lock-wallpaper"></div>
          <div class="lock-top"><p id="lock-date">10月21日 星期三</p><h1 id="lock-time">21:42</h1></div>
          <div class="lock-notifications">
            <button id="han-notification" class="lock-notice incoming" data-lock-open="messages" type="button"><span class="notice-icon message-notice">●</span><div><b>韩振 <time>现在</time></b><p>哥，你的脖子疼吗？</p></div></button>
          </div>
          <div class="lock-bottom"><button type="button" aria-label="手电筒">⌁</button><p id="unlock-hint">向上滑动以解锁</p><button type="button" aria-label="相机">◉</button></div>
          <div class="lock-swipe-bar"></div>
        </section>
        <section id="passcode-screen" class="passcode-screen hidden" aria-label="输入手机密码">
          <div class="passcode-blur"></div>
          <div class="passcode-content">
            <h2>输入密码</h2>
            <div id="passcode-dots" class="passcode-dots" aria-label="已输入 0 位"><i></i><i></i><i></i><i></i></div>
            <p id="passcode-error">请输入 4 位密码</p>
            <div class="keypad">
              <button type="button" data-digit="1"><b>1</b></button><button type="button" data-digit="2"><b>2</b><small>ABC</small></button><button type="button" data-digit="3"><b>3</b><small>DEF</small></button>
              <button type="button" data-digit="4"><b>4</b><small>GHI</small></button><button type="button" data-digit="5"><b>5</b><small>JKL</small></button><button type="button" data-digit="6"><b>6</b><small>MNO</small></button>
              <button type="button" data-digit="7"><b>7</b><small>PQRS</small></button><button type="button" data-digit="8"><b>8</b><small>TUV</small></button><button type="button" data-digit="9"><b>9</b><small>WXYZ</small></button>
              <span></span><button type="button" data-digit="0"><b>0</b></button><button id="delete-digit" type="button" class="delete-key">⌫</button>
            </div>
            <div class="passcode-actions"><button type="button">紧急情况</button><button id="cancel-passcode" type="button">取消</button></div>
          </div>
        </section>
        <section id="home-view" class="view home-view active" data-view="home">
          <div class="wallpaper-orb orb-blue"></div><div class="wallpaper-orb orb-pink"></div><div class="wallpaper-orb orb-gold"></div>
          <div class="home-spacer" aria-hidden="true"></div>
          <div class="app-grid" aria-label="应用列表">
            <button class="app-button system-app" type="button"><span class="app-icon icon-calendar"><small>周三</small><b>21</b></span><span>日历</span></button>
            <button class="app-button system-app" type="button"><span class="app-icon icon-clock"><i></i></span><span>时钟</span></button>
            <button class="app-button system-app" type="button"><span class="app-icon icon-weather">☀</span><span>天气</span></button>
            <button class="app-button system-app" type="button"><span class="app-icon icon-settings">⚙</span><span>设置</span></button>
            <button class="app-button" data-open="instagram" type="button"><img class="app-icon" src="icons/instagram.svg" alt=""/><span>Instagram</span></button>
            <button class="app-button" data-open="x" type="button"><span class="app-icon icon-x">𝕏</span><span>X</span></button>
            <button class="app-button" data-open="photos" type="button"><img class="app-icon" src="icons/photos.svg" alt=""/><span>照片</span></button>
            <button class="app-button" data-open="messages" type="button"><img class="app-icon" src="icons/messages.svg" alt=""/><span>信息</span><em id="messages-badge" class="badge">1</em></button>
            <button class="app-button" data-open="notes" type="button"><span class="app-icon icon-notes">≡</span><span>备忘录</span></button>
            <button class="app-button" data-open="camera" type="button"><img class="app-icon" src="icons/camera.svg" alt=""/><span>相机</span></button>
          </div>
          <div class="page-dots"><b></b><i></i></div>
          <div class="dock">
            <button class="dock-launch" data-open="phone" aria-label="电话" type="button"><img src="icons/phone.svg" alt=""/></button>
            <button class="dock-launch" data-open="camera" aria-label="相机" type="button"><img src="icons/camera.svg" alt=""/></button>
            <button class="dock-launch" data-open="messages" aria-label="信息" type="button"><img src="icons/messages.svg" alt=""/></button>
            <button class="dock-launch" data-open="photos" aria-label="照片" type="button"><img src="icons/photos.svg" alt=""/></button>
          </div>
        </section>

        <section id="list-view" class="view app-view" data-view="list">
          <div class="app-header">
            <button class="nav-button home-action" type="button" aria-label="回到主屏">‹ 主屏幕</button>
            <span id="list-context" class="header-context"></span>
            <button id="add-contact" class="nav-button add-button hidden" type="button">＋</button>
          </div>
          <div class="list-heading"><p id="list-kicker">信息</p><h2 id="list-title">对话</h2><div id="search-wrap" class="search"><span>⌕</span><input id="search-input" placeholder="搜索" /></div></div>
          <div id="list-content" class="list-content"></div>
        </section>

        <section id="chat-view" class="view app-view chat-view" data-view="chat">
          <div class="app-header chat-header">
            <button id="chat-back" class="nav-button" type="button">‹ 返回</button>
            <button id="chat-person" class="chat-person" type="button"><span id="chat-avatar" class="avatar">韩</span><b id="chat-name">珍珍韩振</b><small>›</small></button>
            <span class="header-spacer"></span>
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="composer" class="composer">
            <button type="button" class="plus-button" aria-label="更多">＋</button>
            <input id="message-input" autocomplete="off" maxlength="240" placeholder="信息" aria-label="输入信息" />
            <button class="send-button" type="submit" aria-label="发送">↑</button>
          </form>
        </section>

        <section id="contact-view" class="view app-view" data-view="contact">
          <div class="app-header"><button id="contact-back" class="nav-button" type="button">‹ 联系人</button><b>联系人</b><button id="edit-contact" class="nav-button" type="button">编辑</button></div>
          <div id="contact-detail" class="contact-detail"></div>
        </section>

        <section id="instagram-view" class="view app-view insta-view" data-view="instagram">
          <div class="insta-header"><b>Instagram</b><div><span>♡</span><span>⌁</span></div></div>
          <div id="stories" class="stories"></div>
          <div id="feed" class="feed"></div>
          <nav class="insta-nav"><button class="home-action">⌂</button><button>⌕</button><button>＋</button><button>▻</button><button>◉</button></nav>
        </section>

        <section id="ig-story-viewer" class="ig-story-viewer hidden" aria-label="韩振的限时动态">
          <div id="ig-story-progress" class="ig-story-progress"></div>
          <header><span>韩振 <small id="ig-story-handle">@hanjin0105</small></span><button id="close-ig-story" type="button" aria-label="关闭动态">×</button></header>
          <img id="ig-story-photo" alt="韩振的动态照片"/>
          <button id="prev-ig-story" class="ig-story-prev" type="button" aria-label="上一张动态"></button><button id="next-ig-story" class="ig-story-next" type="button" aria-label="下一张动态"></button>
          <span id="ig-story-count" class="ig-story-count">1 / 4</span>
        </section>

        <section id="x-view" class="view app-view social-view" data-view="x">
          <div class="social-header"><button class="home-action">‹</button><b>𝕏</b><span>✦</span></div>
          <div class="social-tabs"><b>为你推荐</b><span>正在关注</span></div>
          <div class="x-post"><span class="avatar">申</span><div><b>申惟 <small>@shinyu · 2小时</small></b><p>今天也辛苦了。 <span class="x-mention">@韩振</span></p><img class="social-photo" src="photos/70cb2f2414e785939c3dc6705fbdb473.jpg" alt="照片"/><footer class="x-stats"><span aria-label="12,806 条评论">○ 12,806</span><span aria-label="16,230 次转发">↻ 16,230</span><span aria-label="38,652 次赞">♡ 38,652</span></footer></div></div>
          <nav class="social-nav"><button class="home-action">⌂</button><button>⌕</button><button>＋</button><button>♡</button><button>◉</button></nav>
        </section>

        <section class="view app-view notes-view" data-view="notes">
          <div class="app-header"><button class="nav-button home-action" type="button">‹ 主屏幕</button><b>备忘录</b><span></span></div>
          <div class="notes-paper"><input id="note-title" placeholder="标题" aria-label="备忘录标题"/><textarea id="note-body" placeholder="备忘录" aria-label="备忘录正文"></textarea></div>
        </section>
        <section class="view app-view phone-view" data-view="phone">
          <div class="app-header"><button class="nav-button home-action" type="button">‹ 主屏幕</button><b id="phone-title">电话</b><span class="header-spacer"></span></div>
          <div id="phone-recents-panel" class="phone-panel hidden"><h2>通话记录</h2><div id="phone-recents"></div></div>
          <div id="phone-contacts-panel" class="phone-panel hidden"><h2>联系人</h2><div id="phone-contacts"></div></div>
          <div id="phone-keypad-panel" class="phone-panel phone-dialer"><output id="dial-number" aria-live="polite"></output><div id="dial-keypad" class="dial-keypad"></div><button id="dial-call" class="dial-call" type="button" aria-label="拨打">☎</button><p id="dial-status"></p></div>
          <nav class="phone-tabs" aria-label="电话功能"><button type="button" data-phone-tab="recents"><span>◷</span>通话记录</button><button type="button" data-phone-tab="contacts"><span>♙</span>联系人</button><button type="button" data-phone-tab="keypad" class="selected"><span>⠿</span>拨号键盘</button></nav>
        </section>
        <section class="view camera-view" data-view="camera">
          <div class="camera-header"><button class="home-action" type="button">‹ 主屏幕</button><span>闪光灯　关闭</span></div><div id="camera-preview" class="camera-preview"></div><p>照片</p><div class="camera-controls"><button data-open="photos" type="button" aria-label="打开相册"></button><button id="shutter" class="shutter" type="button" aria-label="拍照"></button><button type="button" aria-label="切换镜头">↻</button></div>
        </section>

        <section id="photos-view" class="view app-view photos-view" data-view="photos">
          <div class="photos-head"><button class="home-action">‹ 主屏幕</button><span>选择</span></div>
          <div class="photos-title"><h2>图库</h2><b>2026年10月</b></div>
          <div id="photo-grid" class="photo-grid"></div>
          <nav class="photos-nav"><b>图库</b><span>为你推荐</span><span>相簿</span><span>搜索</span></nav>
        </section>

        <section id="photo-viewer" class="photo-viewer hidden" aria-label="照片查看器">
          <header><button id="close-photo" type="button">‹ 图库</button><span id="photo-count">1 / 25</span><button id="photo-more" type="button">•••</button></header>
          <button id="prev-photo" class="photo-arrow prev" type="button" aria-label="上一张">‹</button>
          <img id="full-photo" alt="相册照片" />
          <button id="next-photo" class="photo-arrow next" type="button" aria-label="下一张">›</button>
          <footer><button type="button">⌁</button><button type="button">♡</button><button type="button">☷</button><button id="delete-photo" type="button">♲</button></footer>
          <div id="delete-sheet" class="delete-sheet hidden"><div><button id="confirm-delete-photo" type="button">删除照片</button><button id="cancel-delete-photo" type="button">取消</button></div></div>
        </section>

        <section id="call-overlay" class="call-overlay hidden" aria-label="韩振的来电">
          <div class="call-bg"></div><div class="call-content"><small id="call-state">iPhone 来电</small><h2>韩振</h2><div class="caller-avatar">韩</div><p id="call-status">正在呼叫…</p><div class="call-actions"><span><button type="button">◉</button><small>提醒我</small></span><span><button type="button">✉</button><small>信息</small></span></div><button class="hangup" type="button">⌕</button></div>
        </section>

        <div id="contact-modal" class="sheet-backdrop hidden" role="dialog" aria-modal="true" aria-label="编辑联系人">
          <form id="contact-form" class="sheet form-sheet"><div class="sheet-handle"></div><div class="sheet-title"><div><small id="form-kicker">新建</small><h3 id="form-title">联系人</h3></div><button id="cancel-contact" type="button">×</button></div><label>姓名<input id="contact-name-input" required maxlength="20" /></label><label>电话号码<input id="contact-phone-input" maxlength="24" /></label><label>备注<input id="contact-note-input" maxlength="60" /></label><button class="primary-button" type="submit">保存</button></form>
        </div>
      </div>
      <button id="home-indicator" class="home-indicator" type="button" aria-label="回到主屏幕"></button>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js?v=8"></script>
</body>
</html>
